[project]
name = "jira-backend"
version = "0.1.0"
description = "API and worker for the Jira-like project management platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.28",
    "markdown>=3.11.2",
    "nh3>=0.3.7",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-markdown>=3.10.2.20261007",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "N", "SIM", "PT", "C4", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "PLR0915"]
"tests/**/test_org_auth*.py" = ["E501", "S608"]  # long SQL fixtures; fixed auth type lists
"tests/integration/conftest.py" = ["E402"]  # pytest_plugins must load before plugin imports
"migrations/**" = ["N999", "S608", "PLR0915"]  # SQL built from module constants only

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "migrations", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires PostgreSQL and Redis (TEST_* environment variables)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

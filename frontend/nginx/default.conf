# Access log records the normalized path ($uri) only: no query string ($args), no
# cookies, no Authorization header. Tokens must never reach logs (plan V2.7).
log_format app_noquery '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent $request_time $request_id "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log app_noquery;

    client_max_body_size 1m;
    root /usr/share/nginx/html;

    # Same-origin API: the browser never needs CORS and session cookies stay first-party.
    # The API sets its own (stricter) security headers; adding ours would duplicate CSP.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        # nginx is the edge here: overwrite (never append to) any client-supplied
        # X-Forwarded-For, so the backend cannot be fed a spoofed client IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Fingerprinted build assets are immutable.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}

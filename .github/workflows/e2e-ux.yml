# Global UX M6 Playwright suite on main (path-scoped) + manual dispatch.
# First run on default branch requires merge; workflow_dispatch cannot validate a file absent from main.
# Full-stack UX E2E only: requires Vite on :5173 and API on :8000 (see make e2e-ux-states).
# Mocked workflow A4b specs run in CI job `e2e-workflow-a4b` (ci.yml) via `make e2e-workflow-a4b` on :5193.
name: E2E UX states

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'backend/migrations/**'
      - 'backend/uv.lock'
      - 'frontend/pnpm-lock.yaml'
      - '.env.example'
      - 'Makefile'
      - '.github/workflows/e2e-ux.yml'
      - 'infra/docker-compose.yml'
      - 'infra/postgres/**'
      - '.nvmrc'
      - 'backend/.python-version'
  workflow_dispatch:

concurrency:
  group: e2e-ux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ux-states:
    name: Playwright ux-states
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Set up pnpm (version from frontend/package.json packageManager)
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: make install

      - name: Start infra and migrate
        run: |
          set -euo pipefail
          make infra-up
          make migrate

      - name: Start API, worker, and Vite (make dev equivalent)
        env:
          # Match CI: no checkout .env; Makefile must export the same vars as local `make dev`.
          ENV_FILE: .env.example
        run: |
          set -euo pipefail
          mkdir -p .tmp
          PID_FILE="${RUNNER_TEMP}/e2e-ux-pids"
          : > "$PID_FILE"

          dump_dev_logs() {
            echo '--- .tmp/backend-dev.log (last 120 lines) ---'
            tail -120 .tmp/backend-dev.log 2>/dev/null || echo '(missing)'
            echo '--- .tmp/worker-dev.log (last 120 lines) ---'
            tail -120 .tmp/worker-dev.log 2>/dev/null || echo '(missing)'
            echo '--- .tmp/frontend-dev.log (last 120 lines) ---'
            tail -120 .tmp/frontend-dev.log 2>/dev/null || echo '(missing)'
          }

          on_stack_failure() {
            dump_dev_logs
            exit 1
          }

          # ux-states creates many fresh accounts from one runner IP; SIGNUP_PER_IP is 5/hour with
          # RATE_LIMIT_ENABLED=true in .env.example. CLI assignment overrides include+export for Make
          # and is exported to uvicorn/worker (same as local `make backend-dev RATE_LIMIT_ENABLED=false`).
          make RATE_LIMIT_ENABLED=false backend-dev >> .tmp/backend-dev.log 2>&1 &
          echo $! >> "$PID_FILE"
          make RATE_LIMIT_ENABLED=false worker-dev >> .tmp/worker-dev.log 2>&1 &
          echo $! >> "$PID_FILE"
          make frontend-dev >> .tmp/frontend-dev.log 2>&1 &
          echo $! >> "$PID_FILE"

          curl --fail-with-body --retry 30 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8000/readyz || on_stack_failure
          curl --fail-with-body --retry 30 --retry-delay 2 --retry-all-errors \
            http://localhost:5173/ || on_stack_failure

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install chromium --with-deps

      - name: Run ux-states E2E
        run: make e2e-ux-states

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ux-states-${{ github.run_id }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop dev processes and containers
        if: always()
        run: |
          set +e
          PID_FILE="${RUNNER_TEMP}/e2e-ux-pids"
          if [ -f "$PID_FILE" ]; then
            while read -r pid; do
              if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
                kill "$pid" 2>/dev/null || true
                pkill -P "$pid" 2>/dev/null || true
              fi
            done < "$PID_FILE"
          fi
          make down

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
      docker: ${{ steps.filter.outputs.docker }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            migrations:
              - 'backend/migrations/**'
            docker:
              - 'backend/Dockerfile'
              - 'backend/.dockerignore'
              - 'frontend/Dockerfile'
              - 'frontend/.dockerignore'
              - 'infra/docker-compose.yml'
            code:
              - 'backend/**'
              - 'frontend/**'
              - 'infra/**'
              - 'Makefile'
              - '.github/**'
              - '.env.example'
              - '.gitleaks.toml'
              - '.gitignore'

  docs-only:
    name: Docs only (secrets scan)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: make ci-docs
        env:
          CI_GITLEAKS_FULL_HISTORY: "0"
        run: make ci-docs

  ci:
    name: make ci
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Set up pnpm (version from frontend/package.json packageManager)
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: make ci
        env:
          SKIP_MIGRATE_ROUNDTRIP: ${{ (github.ref == 'refs/heads/main' || needs.changes.outputs.migrations == 'true') && '0' || '1' }}
          CI_GITLEAKS_FULL_HISTORY: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: make ci

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main' || needs.changes.outputs.docker == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build container images (local only, not pushed)
        if: github.ref == 'refs/heads/main' || needs.changes.outputs.docker == 'true'
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: make images

      - name: Stop services
        if: always()
        run: make down

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The code checks run as parallel jobs (see docs/ci.md):
#   backend              lint, types, unit tests, migration round-trip, dependency audit
#   backend-integration  integration tests, split into 3 shards that run in parallel
#   frontend             lint, types, unit tests, build, dependency audit
#   contract             openapi.json and generated TypeScript types match the backend
#   secrets              gitleaks
#   images               container image build (main, or when Dockerfiles change)
# `make ci` runs all of this in one go locally. The "CI" job at the end is the single
# required check: it decides from the results of all the others.

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
      docker: ${{ steps.filter.outputs.docker }}
      code: ${{ steps.filter.outputs.code }}
      documentation: ${{ steps.filter.outputs.documentation }}
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            documentation:
              - 'docs/**'
              - 'README.md'
              - 'DEPLOYMENT.md'
              - 'PLAN.md'
            migrations:
              - 'backend/migrations/**'
            docker:
              - 'backend/Dockerfile'
              - 'backend/.dockerignore'
              - 'frontend/Dockerfile.compose'
              - 'frontend/.dockerignore'
              - 'infra/docker-compose.yml'
            code:
              - 'backend/**'
              - 'frontend/**'
              - 'infra/**'
              - 'Makefile'
              - '.github/**'
              - '.env.example'
              - '.gitleaks.toml'
              - '.gitignore'
              - 'backend/uv.lock'
              - 'frontend/pnpm-lock.yaml'
              - '.nvmrc'
              - '.editorconfig'
              - 'render.yaml'

      # `frontend` or `backend` when a PR changes only that side (plus documentation): the
      # other side's job is skipped. Everything else, and every non-PR run (main, manual),
      # is `full`. See .github/scripts/classify_pr_paths.py.
      - name: Classify CI scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          scope=full
          if [ "$EVENT_NAME" = "pull_request" ]; then
            scope=$(git diff --name-only "$BASE_SHA" HEAD | python3 .github/scripts/classify_pr_paths.py --scope)
          fi
          echo "CI scope: $scope"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

  docs-only:
    name: Docs only (secrets scan)
    needs: changes
    if: |
      github.event_name == 'pull_request' &&
      needs.changes.outputs.documentation == 'true' &&
      needs.changes.outputs.code != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: make ci-docs
        env:
          CI_GITLEAKS_FULL_HISTORY: "0"
        run: make ci-docs

  backend:
    name: Backend (lint, types, unit, migrations, audit)
    needs: changes
    if: |
      needs.changes.outputs.scope != 'frontend' && (
        github.event_name == 'workflow_dispatch' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true') ||
        (github.event_name == 'pull_request' && needs.changes.outputs.documentation != 'true')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true

      - name: make ci-backend
        env:
          SKIP_MIGRATE_ROUNDTRIP: ${{ (github.ref == 'refs/heads/main' || needs.changes.outputs.migrations == 'true') && '0' || '1' }}
        run: make ci-backend

      - name: Stop services
        if: always()
        run: make down

  backend-integration:
    # Three parallel jobs, each with its own Postgres/Redis/Mailpit containers. The test files
    # are split by .github/scripts/shard_tests.py. The shard count appears three times below
    # (matrix, job name, SHARD): change them together.
    name: Backend integration (shard ${{ matrix.shard }}/3)
    needs: changes
    if: |
      needs.changes.outputs.scope != 'frontend' && (
        github.event_name == 'workflow_dispatch' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true') ||
        (github.event_name == 'pull_request' && needs.changes.outputs.documentation != 'true')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true

      - name: make ci-backend-integration (shard ${{ matrix.shard }}/3)
        env:
          SHARD: ${{ matrix.shard }}/3
        run: make ci-backend-integration SHARD="$SHARD"

      - name: Stop services
        if: always()
        run: make down

  frontend:
    name: Frontend (lint, types, unit, build, audit)
    needs: changes
    if: |
      needs.changes.outputs.scope != 'backend' && (
        github.event_name == 'workflow_dispatch' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true') ||
        (github.event_name == 'pull_request' && needs.changes.outputs.documentation != 'true')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm (version from frontend/package.json packageManager)
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: make ci-frontend
        run: make ci-frontend

  contract:
    # openapi.json and the generated TypeScript types must match the backend. Needs both
    # toolchains but no database, and runs for every code change (either side can break it).
    name: API contract (OpenAPI drift)
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.documentation != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Set up pnpm (version from frontend/package.json packageManager)
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: make ci-contract
        run: make ci-contract

  secrets:
    name: Secrets scan (gitleaks)
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.documentation != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          persist-credentials: false

      - name: make ci-secrets-scan
        env:
          CI_GITLEAKS_FULL_HISTORY: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: make ci-secrets-scan

  images:
    name: Container images
    needs: changes
    if: |
      (github.ref == 'refs/heads/main' || needs.changes.outputs.docker == 'true') && (
        github.event_name == 'workflow_dispatch' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true') ||
        (github.event_name == 'pull_request' && needs.changes.outputs.documentation != 'true')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container images (local only, not pushed)
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: make images

  e2e-workflow-a4b:
    name: Playwright workflow A4b (mocked)
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.documentation != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      # Omit E2E_BASE_URL so Playwright starts Vite on :5193 (see playwright.config.ts).
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm (version from frontend/package.json packageManager)
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: make frontend-install

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install chromium --with-deps

      - name: Run mocked workflow E2E (make e2e-workflow-a4b)
        run: make e2e-workflow-a4b

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-workflow-a4b-${{ github.run_id }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # Single PR conclusion job so branch protection can require "CI" without having to know
  # which jobs were skipped (docs-only path, or a frontend-only / backend-only change).
  ci-required:
    name: CI
    needs:
      - changes
      - docs-only
      - backend
      - backend-integration
      - frontend
      - contract
      - secrets
      - images
      - e2e-workflow-a4b
    if: always() && !cancelled() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: CI helper script self-tests (path scope, test sharding, gate)
        run: make test-ci-scripts

      - name: Require the code jobs or the docs-only job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SCOPE: ${{ needs.changes.outputs.scope }}
        run: python3 .github/scripts/ci_gate.py

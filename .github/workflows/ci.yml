name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
      docker: ${{ steps.filter.outputs.docker }}
      code: ${{ steps.filter.outputs.code }}
      documentation: ${{ steps.filter.outputs.documentation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            documentation:
              - 'docs/**'
              - 'README.md'
              - 'DEPLOYMENT.md'
              - 'PLAN.md'
            migrations:
              - 'backend/migrations/**'
            docker:
              - 'backend/Dockerfile'
              - 'backend/.dockerignore'
              - 'frontend/Dockerfile'
              - 'frontend/.dockerignore'
              - 'infra/docker-compose.yml'
            code:
              - 'backend/**'
              - 'frontend/**'
              - 'infra/**'
              - 'Makefile'
              - '.github/**'
              - '.env.example'
              - '.gitleaks.toml'
              - '.gitignore'
              - 'backend/uv.lock'
              - 'frontend/pnpm-lock.yaml'
              - '.nvmrc'
              - '.editorconfig'
              - 'render.yaml'

  docs-only:
    name: Docs only (secrets scan)
    needs: changes
    if: |
      github.event_name == 'pull_request' &&
      needs.changes.outputs.documentation == 'true' &&
      needs.changes.outputs.code != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: make ci-docs
        env:
          CI_GITLEAKS_FULL_HISTORY: "0"
        run: make ci-docs

  ci:
    name: make ci
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.documentation != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Set up pnpm (version from frontend/package.json packageManager)
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: make ci
        env:
          SKIP_MIGRATE_ROUNDTRIP: ${{ (github.ref == 'refs/heads/main' || needs.changes.outputs.migrations == 'true') && '0' || '1' }}
          CI_GITLEAKS_FULL_HISTORY: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: make ci

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main' || needs.changes.outputs.docker == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build container images (local only, not pushed)
        if: github.ref == 'refs/heads/main' || needs.changes.outputs.docker == 'true'
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: make images

      - name: Stop services
        if: always()
        run: make down

  e2e-workflow-a4b:
    name: Playwright workflow A4b (mocked)
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.documentation != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      # Omit E2E_BASE_URL so Playwright starts Vite on :5193 (see playwright.config.ts).
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm (version from frontend/package.json packageManager)
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: make frontend-install

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install chromium --with-deps

      - name: Run mocked workflow E2E (make e2e-workflow-a4b)
        run: make e2e-workflow-a4b

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-workflow-a4b-${{ github.run_id }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # Single PR conclusion job so branch protection can require "CI" without treating
  # skipped full-ci as a pending check when the docs-only path ran instead.
  ci-required:
    name: CI
    needs: [changes, docs-only, ci, e2e-workflow-a4b]
    if: always() && !cancelled() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Path classification self-test
        run: python3 .github/scripts/classify_pr_paths.py

      - name: Require full CI or docs-only success
        env:
          CI_RESULT: ${{ needs.ci.result }}
          DOCS_RESULT: ${{ needs.docs-only.result }}
          E2E_WORKFLOW_RESULT: ${{ needs.e2e-workflow-a4b.result }}
        run: |
          set -euo pipefail
          if [ "$CI_RESULT" = "success" ]; then
            if [ "$E2E_WORKFLOW_RESULT" != "success" ]; then
              echo "make ci passed but workflow A4b E2E did not (result=$E2E_WORKFLOW_RESULT)." >&2
              exit 1
            fi
            echo "Full CI and workflow A4b E2E passed."
            exit 0
          fi
          if [ "$DOCS_RESULT" = "success" ]; then
            echo "Documentation-only CI passed."
            exit 0
          fi
          echo "CI did not pass (make ci=$CI_RESULT, docs-only=$DOCS_RESULT, e2e-workflow-a4b=$E2E_WORKFLOW_RESULT)." >&2
          exit 1
